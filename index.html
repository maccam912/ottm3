<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OTTM3 — Over The Top Match 3</title>
    <meta name="description" content="OTTM3 is a neon cosmic match-3 jackpot with explosive powerup combinations and escalating combo overload." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./img/icon-192.png" />
    <link rel="apple-touch-icon" href="./img/icon-192.png" />
    <meta name="theme-color" content="#16002e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OTTM3" />
    <style>
      :root {
        color-scheme: dark;
        background: #05000f;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 50% 20%, #3b075f 0, #10001f 42%, #05000f 100%);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        box-sizing: border-box;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game" role="application" aria-label="OTTM3 game"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
